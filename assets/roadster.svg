<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
<title id="title">Silver Roadster concept</title><desc id="desc">An original low two-door sports-car illustration with a sculpted silver body, dark panoramic canopy, turbine wheels and slim lighting. Concept styling only.</desc>
<defs>
 <linearGradient id="body" x1="0" y1="0" x2=".12" y2="1"><stop stop-color="#f6f7f4"/><stop offset=".25" stop-color="#b9c0be"/><stop offset=".46" stop-color="#626e70"/><stop offset=".49" stop-color="#d0d6d1"/><stop offset=".64" stop-color="#7c8988"/><stop offset="1" stop-color="#252e30"/></linearGradient>
 <linearGradient id="hood" x1=".2" y1="0" x2=".7" y2="1"><stop stop-color="#e6ebe6"/><stop offset=".45" stop-color="#9ca8a7"/><stop offset="1" stop-color="#364749"/></linearGradient>
 <linearGradient id="glass" x1=".2" y1="0" x2=".7" y2="1"><stop stop-color="#607579"/><stop offset=".3" stop-color="#283f46"/><stop offset=".7" stop-color="#101c23"/><stop offset="1" stop-color="#080e14"/></linearGradient>
 <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e2e7e6"/><stop offset=".4" stop-color="#68777d"/><stop offset=".7" stop-color="#c0caca"/><stop offset="1" stop-color="#34454a"/></linearGradient>
 <linearGradient id="spoke"><stop stop-color="#dae2df"/><stop offset="1" stop-color="#718188"/></linearGradient>
 <radialGradient id="tire"><stop stop-color="#465258"/><stop offset=".68" stop-color="#1c252a"/><stop offset=".83" stop-color="#090f14"/><stop offset="1" stop-color="#1a2327"/></radialGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="9"/></filter>
 <g id="wheel"><circle r="68" fill="url(#tire)" stroke="#354044" stroke-width="2"/><circle r="56" fill="#0d171d" stroke="url(#rim)" stroke-width="3"/><circle r="42" fill="#586467"/><circle r="37" fill="#303d43" stroke="#7e8b89" stroke-width="1"/><path d="M31-26q13 8 14 26t-12 26l-7-10V-16Z" fill="#bb7350"/>
 <g id="blade" fill="url(#spoke)"><path d="M-7-6-18-50-6-55 8-12 6 1Z"/><path d="M-7-6-28-46-23-50-1-12Z" opacity=".65"/></g><use href="#blade" transform="rotate(72)"/><use href="#blade" transform="rotate(144)"/><use href="#blade" transform="rotate(216)"/><use href="#blade" transform="rotate(288)"/><circle r="12" fill="#24343b" stroke="#a8b8b8" stroke-width="2"/><circle r="4" fill="#87999b"/><circle r="61" fill="none" stroke="#738080" stroke-width=".5" opacity=".5"/></g>
</defs>
<ellipse cx="560" cy="352" rx="455" ry="20" fill="#000" opacity=".9" filter="url(#soft)"/>
<!-- Low, long hood; a compact canopy and broad rear haunches. -->
<path d="M87 269q14-33 71-46l229-37q75-65 157-67l115 8q62 11 126 60l134 24q64 12 91 51l-7 46-79 27-745-2-80-20Z" fill="url(#body)" stroke="#b0bdb9" stroke-width="1.4"/>
