<path d="m934 228 57 19 12 10-75-17Z" fill="#401d1d"/><path d="m936 230 57 18" stroke="#ef7467" stroke-width="3" stroke-linecap="round"/>
<path d="m943 271 58 5-4 24-55 15Z" fill="#0b151d"/><path d="m953 281 33 3m-34 9 31-1" stroke="#53666b" stroke-width="2"/>
